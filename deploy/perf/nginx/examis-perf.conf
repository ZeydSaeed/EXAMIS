# EXAMIS perf: the load-test copy, on 127.0.0.1:8443 only (never public).
# Locations mirror deploy/staging/nginx/examis-staging.conf.
#
# Every k6 virtual user connects from 127.0.0.1, so per-address rate limits
# would throttle the run. Here only, the client address comes from the
# X-QE-Client-IP header k6 sends; only processes on this host can reach it.

log_format examis_perf '$time_iso8601 $remote_addr $host "$request" $status '
                       '$body_bytes_sent rt=$request_time urt=$upstream_response_time '
                       'rid=$sent_http_x_request_id';

server {
    listen 127.0.0.1:8443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 127.0.0.1:8443 ssl http2;
    server_name students.perf.localhost staff.perf.localhost;

    ssl_certificate /etc/examis-perf/tls.pem;
    ssl_certificate_key /etc/examis-perf/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:examisperf:5m;
    ssl_session_timeout 1d;

    set_real_ip_from 127.0.0.1;
    real_ip_header X-QE-Client-IP;

    access_log /var/log/nginx/examis-perf.access.log examis_perf;
    error_log /var/log/nginx/examis-perf.error.log;

    root /srv/examis-perf/app/public;
    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 6m;
    fastcgi_buffer_size 32k;
    fastcgi_buffers 16 16k;

    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml;

    location = /fpm-status {
        access_log off;
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME /fpm-status;
        fastcgi_param SCRIPT_FILENAME /fpm-status;
        fastcgi_pass unix:/run/examis-perf/fpm.sock;
    }

    location /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/examis-perf/fpm.sock;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
