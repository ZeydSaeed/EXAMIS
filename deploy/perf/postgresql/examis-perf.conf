# EXAMIS perf cluster (16/perf, port 5433). Same planner and logging settings
# as staging (deploy/staging/postgresql/examis-tuning.conf); half the buffers,
# so both clusters fit in 7.5 GB beside PHP, Redis and k6. Differences are
# recorded with each result.
listen_addresses = '127.0.0.1'
max_connections = 40
shared_buffers = 512MB
effective_cache_size = 2GB
work_mem = 8MB
maintenance_work_mem = 256MB
random_page_cost = 1.1
effective_io_concurrency = 200
wal_compression = on
checkpoint_completion_target = 0.9
log_min_duration_statement = 250ms
log_lock_waits = on
track_io_timing = on
# Statement statistics for the remediation loop; only this cluster loads them.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
