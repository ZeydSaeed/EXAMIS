# EXAMIS perf Redis: loopback only, same memory cap and policy as staging,
# no persistence (the perf data is rebuilt for each session).
bind 127.0.0.1 -::1
port 6380
protected-mode yes
requirepass __REDIS_PASSWORD__
maxmemory 256mb
maxmemory-policy volatile-lru
save ""
appendonly no
dir /var/lib/examis-perf-redis
supervised systemd
daemonize no
logfile ""
