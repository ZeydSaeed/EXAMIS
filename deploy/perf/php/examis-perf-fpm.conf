; EXAMIS perf PHP-FPM: its own master, so starting or stopping it never
; touches the staging pool. php.ini and conf.d are the staging ones (same
; OPcache and limits). The pool mirrors deploy/staging/php/examis-pool.conf.
[global]
pid = /run/examis-perf/fpm.pid
error_log = /var/log/examis-perf-fpm.log

[examis-perf]
user = examisperf
group = examisperf
listen = /run/examis-perf/fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = static
pm.max_children = 16
pm.max_requests = 1000
pm.status_path = /fpm-status

request_terminate_timeout = 120s
catch_workers_output = yes
php_admin_value[error_log] = /srv/examis-perf/storage/logs/php-fpm.log
php_admin_flag[log_errors] = on
