# EXAMIS staging. provision.sh replaces the host placeholders.
# Requests for any other host name are dropped.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name __STUDENTS_HOST__ __STAFF_HOST__;

    root /srv/examis/current/public;
    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 6m;

    # Staging only: keep it out of search engines and behind a password.
    add_header X-Robots-Tag "noindex, nofollow" always;
    auth_basic "EXAMIS staging";
    auth_basic_user_file /etc/nginx/examis-staging.htpasswd;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml;

    # Liveness probe for monitoring, without the password. It reveals nothing.
    location = /up {
        auth_basic off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/examis.sock;
    }

    # Built assets have content hashes in their names: cache them for a year.
    location /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/examis.sock;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
