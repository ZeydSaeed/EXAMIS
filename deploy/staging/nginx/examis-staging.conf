# EXAMIS staging. provision.sh replaces the host placeholders.
# Traffic arrives through Cloudflare only (firewall), over HTTPS with the
# Cloudflare Origin Certificate (SSL mode "Full (strict)"). The visitor's
# address comes from conf.d/cloudflare-realip.conf.

# Any other host name: dropped, on both ports.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# Our names over plain HTTP: redirect (Cloudflare normally does this first).
server {
    listen 80;
    listen [::]:80;
    server_name __STUDENTS_HOST__ __STAFF_HOST__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __STUDENTS_HOST__ __STAFF_HOST__;

    ssl_certificate /etc/ssl/examis/origin.pem;
    ssl_certificate_key /etc/ssl/examis/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:examis:10m;
    ssl_session_timeout 1d;

    root /srv/examis/current/public;
    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 6m;

    # Staging only: keep it out of search engines and behind a password.
    add_header X-Robots-Tag "noindex, nofollow" always;
    auth_basic "EXAMIS staging";
    auth_basic_user_file /etc/nginx/examis-staging.htpasswd;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml;

    # Liveness probe. Without the password only from this server (release.sh);
    # from outside it asks for the password like every other page, because the
    # page shows the render time and loads a third-party script.
    location = /up {
        satisfy any;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/examis.sock;
    }

    # Built assets have content hashes in their names: cache them for a year.
    location /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/examis.sock;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
