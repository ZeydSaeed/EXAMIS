; EXAMIS PHP-FPM pool. 16 workers at about 50 MB each is about 800 MB,
; enough for 10–50 users at once with room for PostgreSQL and Redis.
[examis]
user = examis
group = examis
listen = /run/php/examis.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = static
pm.max_children = 16
pm.max_requests = 1000

request_terminate_timeout = 120s
catch_workers_output = yes
php_admin_value[error_log] = /srv/examis/shared/storage/logs/php-fpm.log
php_admin_flag[log_errors] = on
