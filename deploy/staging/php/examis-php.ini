; EXAMIS overrides. Photos are shrunk in the browser to about 150 KB; the
; type limit is 2 MB, so 4 MB leaves room for the multipart overhead.
expose_php = Off
memory_limit = 256M
upload_max_filesize = 4M
post_max_size = 6M
max_execution_time = 60

opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Releases swap a symlink and reload PHP-FPM, so files never change in place.
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
