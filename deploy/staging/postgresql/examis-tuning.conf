# EXAMIS staging on 4 vCPU / 8 GB, shared with PHP-FPM and Redis.
# Starting points from docs/database/SCHEMA.md §6, scaled down; tune from k6.
max_connections = 50
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 8MB
maintenance_work_mem = 256MB
random_page_cost = 1.1
effective_io_concurrency = 200
wal_compression = on
checkpoint_completion_target = 0.9
log_min_duration_statement = 250ms
log_lock_waits = on
