name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, static analysis, dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist
          npm ci

      # The route helpers under resources/js/{routes,actions,wayfinder} are
      # generated, not committed; the build makes them, this job does not build.
      - name: Generate Wayfinder route helpers
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan wayfinder:generate --with-form

      - name: Pint
        run: composer lint:check

      - name: Larastan
        run: composer types:check

      - name: Frontend lint and types
        run: |
          npm run check
          npm run types:check

      - name: Composer audit
        run: composer audit --no-interaction

      - name: npm audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high

  tests-postgres:
    name: Pest on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: examis_testing
          POSTGRES_USER: examis
          POSTGRES_PASSWORD: examis-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U examis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: examis_testing
      DB_USERNAME: examis
      DB_PASSWORD: examis-ci-only
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, gd, intl, mbstring, fileinfo
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Prepare application
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
          npm ci
          npm run build

      - name: Migrations apply cleanly (fresh + rollback + re-apply)
        run: |
          php artisan migrate --force
          php artisan migrate:rollback --force
          php artisan migrate --force

      - name: Pest
        run: php artisan test --compact --log-junit storage/logs/junit.xml

      # Failing tests as annotations, readable on the pull request without
      # opening the log.
      - name: Report failing tests
        if: failure()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          try:
              root = ET.parse('storage/logs/junit.xml').getroot()
          except Exception as error:
              print(f'::error::No JUnit report ({error})')
              raise SystemExit(0)
          for case in root.iter('testcase'):
              for problem in list(case.findall('failure')) + list(case.findall('error')):
                  text = (problem.text or problem.get('message') or '').strip().replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                  print(f"::error title={case.get('name', '')[:120]}::{case.get('file', '')}%0A{text[:1500]}")
          PY

  e2e:
    name: Playwright (Chromium)
    runs-on: ubuntu-latest
    needs: quality
    # playwright.config.ts runs the app against PostgreSQL examis_testing.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: examis_testing
          POSTGRES_USER: examis
          POSTGRES_PASSWORD: examis-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U examis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: examis
      DB_PASSWORD: examis-ci-only
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, gd, intl, mbstring, fileinfo
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Prepare application
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
          npm ci
          npm run build
          npx playwright install --with-deps chromium

      - name: Playwright
        run: npm run test:e2e -- --project=chromium --project=mobile-chromium

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4 # TODO: pin to a verified commit SHA like the other actions
        with:
          name: playwright-report
          path: storage/e2e/report
          retention-days: 14

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
